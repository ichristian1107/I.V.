<!doctype html>
<html lang="es" data-modo="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<link rel="manifest" href="manifest.json">
<title>I.V</title>
<!--
  I.V — núcleo nuevo. Un solo archivo, sin librerías, funciona sin internet para todo menos "pensar" (Gemini).

  CÓMO ESTÁ ARMADO (de arriba hacia abajo en el código):
  1. DB        guarda todo en el celular (localStorage, prefijo "iv:")
  2. Voice     voz que habla (síntesis) y voz que escucha (reconocimiento)
  3. Plugins   cada "mano" es un archivo .js que corre en un Worker aislado (sin acceso a tu clave ni a la pantalla)
  4. Brain     habla con Gemini y le pasa las herramientas de los plugins (function calling)
  5. UI        chat, orbe, modo azul/rojo, ventanas de Manos / Memoria / Ajustes

  Para sumar una función nueva: escribe un plugin (mira los bloques <script type="text/iv-plugin"> al final)
  y súbelo desde MANOS > Agregar plugin, o pídele a I.V que lo cree.
-->
<style>
:root {
  --rgb: 46, 168, 255;
  --acc: rgb(var(--rgb));
  --bg: #04070d;
  --bg2: #0a1422;
  --fg: #dff0ff;
  --muted: #7f93a8;
  --line: rgba(var(--rgb), .28);
  --glow: rgba(var(--rgb), .45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html[data-modo="rojo"] {
  --rgb: 255, 59, 59;
  --bg: #0b0405;
  --bg2: #1b0a0c;
  --fg: #ffe4e4;
  --muted: #b78f90;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 0%, var(--bg2), var(--bg) 60%);
  color: var(--fg);
  font: 15px/1.45 var(--font);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background .5s;
}
button { font: inherit; color: inherit; }
header.top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px));
}
.pill {
  justify-self: center;
  font: 600 12px var(--mono);
  letter-spacing: .16em;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(var(--rgb), .08);
  color: var(--acc);
  text-transform: uppercase;
  white-space: nowrap;
}
.ghost {
  font: 600 11px var(--mono);
  letter-spacing: .14em;
  padding: 7px 10px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
}
.ghost:active { background: rgba(var(--rgb), .15); }
#modoBtn { justify-self: end; color: #ff6b6b; border-color: #ff3b3b; font-weight: 800; }
html[data-modo="rojo"] #modoBtn { background: #ff3b3b; color: #000; }
#cfgBtn { justify-self: start; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(var(--rgb), .06) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--rgb), .06) 1px, transparent 1px);
  background-size: 28px 28px; -webkit-mask-image: radial-gradient(circle at 50% 18%, #000, transparent 72%); mask-image: radial-gradient(circle at 50% 18%, #000, transparent 72%); }
body::after { content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; }
html[data-modo="rojo"] body::after { opacity: 1; box-shadow: inset 0 0 110px rgba(255, 30, 30, .6); animation: alarm 1.1s ease-in-out infinite; }
body.flash::after { opacity: 1; box-shadow: inset 0 0 70px rgba(var(--rgb), .7); animation: alarm .6s ease-in-out 8; }
@keyframes alarm { 50% { opacity: .2; } }
@keyframes blink { 50% { opacity: .5; } }
.hazard { display: none; height: 9px; background: repeating-linear-gradient(-45deg, #ff3b3b 0 12px, #150506 12px 24px); }
html[data-modo="rojo"] .hazard { display: block; }
html[data-modo="rojo"] .pill { background: #ff3b3b; color: #000; border-color: #ff3b3b; animation: blink 1s steps(2) infinite; }
.hud { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 2px 14px 0; }
.ringbox { position: relative; width: 128px; height: 128px; flex: none; }
#ring { width: 100%; height: 100%; display: block; }
#ring line { stroke: var(--acc); stroke-width: 1.7; stroke-linecap: round; }
html[data-modo="rojo"] #ring line { stroke-width: 2.4; }
#ring circle { fill: none; stroke: var(--line); stroke-width: 1; }
#ring .c2 { stroke-dasharray: 3 5; transform-origin: 60px 60px; animation: spin 24s linear infinite; }
html[data-modo="rojo"] #ring .c2 { animation-duration: 3s; stroke: var(--acc); }
@keyframes spin { to { transform: rotate(360deg); } }
.rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.rc b { font: 800 22px var(--mono); letter-spacing: .12em; color: var(--acc); text-shadow: 0 0 14px var(--glow); }
html[data-modo="rojo"] .rc b { font-size: 15px; }
.rc small { font: 600 8.5px var(--mono); letter-spacing: .14em; color: var(--muted); margin-top: 2px; }
.ro { margin: 0; display: grid; grid-template-columns: auto auto; gap: 6px 18px; }
.ro dt { font: 600 9.5px var(--mono); letter-spacing: .14em; color: var(--muted); }
.ro dd { margin: 0; font: 700 16px var(--mono); color: var(--acc); }
.free { margin: 0 max(14px, env(safe-area-inset-left, 0px)) 6px; padding: 8px; font: 700 11px var(--mono); letter-spacing: .14em; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; }
.free.on { border: 1px solid var(--acc); background: var(--acc); color: #000; }
.quick {
  display: grid;
  grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 6px;
  padding: 6px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px));
}
.quick button {
  font: 600 10.5px var(--mono);
  letter-spacing: .08em;
  padding: 9px 2px;
  background: rgba(var(--rgb), .07);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--fg);
  cursor: pointer;
}
.quick button:active, .quick a:active { background: rgba(var(--rgb), .22); }
.quick a { display: block; text-align: center; text-decoration: none; font: 800 11px var(--mono); letter-spacing: .06em; padding: 10px 2px; border-radius: 8px; color: #000; background: #ff3b3b; border: 1px solid #ff3b3b; }
.quick a small { display: block; font-size: 15px; }
#chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
  mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
}
.msg { max-width: 86%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.u { align-self: flex-end; background: rgba(var(--rgb), .2); border: 1px solid var(--line); border-bottom-right-radius: 3px; }
.msg.a { align-self: flex-start; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); border-bottom-left-radius: 3px; }
.msg.sys { align-self: center; max-width: 94%; font: 12px var(--mono); color: var(--acc); text-align: center; padding: 4px 8px; }
.msg.tool { align-self: flex-start; font: 11px var(--mono); color: var(--muted); padding: 0 4px; }
form.bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--line);
  background: rgba(0, 0, 0, .25);
}
#txt {
  flex: 1;
  min-width: 0;
  resize: none;
  font: 16px/1.35 var(--font);
  color: var(--fg);
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
#txt:focus-visible, .ghost:focus-visible, .quick button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}
.ib {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--acc);
  background: rgba(var(--rgb), .12);
  color: var(--acc);
  font: 700 11px var(--mono);
  letter-spacing: .05em;
  cursor: pointer;
}
.ib.on { background: var(--acc); color: #000; }
#send { background: var(--acc); color: #000; }
/* ventanas */
#modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .6); }
#modal[hidden] { display: none; }
.sheet {
  width: 100%;
  max-width: 640px;
  max-height: 88dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet > header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.sheet h2 { margin: 0; font: 700 14px var(--mono); letter-spacing: .14em; color: var(--acc); text-transform: uppercase; }
.sheet .body { overflow-y: auto; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: rgba(255, 255, 255, .03); }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card p { margin: 2px 0; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { font: 11px var(--mono); padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--acc); }
.btn { font: 600 13px var(--font); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--acc); background: rgba(var(--rgb), .12); color: var(--acc); cursor: pointer; }
.btn.main { background: var(--acc); color: #000; }
.btn.warn { border-color: #ff6b6b; color: #ff9b9b; background: transparent; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=password], select, textarea.big {
  font: 16px var(--font);
  color: var(--fg);
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  width: 100%;
}
textarea.big { font: 12px/1.4 var(--mono); min-height: 140px; }
pre.code { margin: 6px 0 0; padding: 10px; max-height: 240px; overflow: auto; background: #000; border: 1px solid var(--line); border-radius: 8px; font: 11px/1.4 var(--mono); color: #bfe0ff; white-space: pre; }
.msg.lnk { align-self: flex-start; background: var(--acc); color: #000; font-weight: 700; text-decoration: none; }
#toast {
  position: fixed;
  left: 50%;
  top: calc(56px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  z-index: 30;
  max-width: 90%;
  padding: 9px 14px;
  border-radius: 8px;
  background: var(--acc);
  color: #000;
  font: 600 13px var(--font);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <button class="ghost" id="cfgBtn" type="button">AJUSTES</button>
  <div class="pill" id="pill">Iniciando</div>
  <button class="ghost" id="modoBtn" type="button" aria-label="Cambiar modo">MODO AZUL</button>
</header>

<div class="hazard" aria-hidden="true"></div>
<section class="hud" aria-label="Estado de I.V">
  <div class="ringbox">
    <svg id="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="35"/><circle class="c2" cx="60" cy="60" r="29"/></svg>
    <div class="rc"><b id="rcT">I.V</b><small id="rcS">INICIANDO</small></div>
  </div>
  <dl class="ro">
    <div><dt>HORA</dt><dd id="roH">--:--</dd></div>
    <div><dt>AVISOS</dt><dd id="roA">0</dd></div>
    <div><dt>MEMORIA</dt><dd id="roM">0</dd></div>
    <div><dt>MANOS</dt><dd id="roP">0</dd></div>
  </dl>
</section>

<nav class="quick" id="quick" aria-label="Accesos rápidos"></nav>

<main id="chat" aria-live="polite"></main>

<button class="free" id="conv" type="button" aria-pressed="false">MANOS LIBRES: APAGADO</button>
<form class="bar" id="form" autocomplete="off">
  <textarea id="txt" rows="2" placeholder="Escríbele o toca el micrófono" aria-label="Mensaje"></textarea>
  <button class="ib" id="mic" type="button" title="Hablar">MIC</button>
  <button class="ib" id="send" type="submit" title="Enviar">IR</button>
</form>

<div id="modal" hidden><div class="sheet"><header><h2 id="mTitle"></h2><button class="ghost" id="mClose" type="button">CERRAR</button></header><div class="body" id="mBody"></div></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* =========================================================
   1. DB: todo se guarda en el celular
   ========================================================= */
const DB = {
  get(k, d) { try { const v = localStorage.getItem("iv:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("iv:" + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem("iv:" + k); } catch (e) {} }
};
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const MODELOS_RESPALDO = ["gemini-3.5-flash-lite", "gemini-3.6-flash", "gemini-2.5-flash-lite"];
const cfg = Object.assign({ key: "", model: MODELOS_RESPALDO[0], nombre: "Mauro", voz: true, modo: "azul" }, DB.get("cfg", {}));
const saveCfg = () => DB.set("cfg", cfg);
let facts = DB.get("facts", []);
let chat = DB.get("chat", []);
let busy = false;
let conv = false;

/* =========================================================
   UI básica
   ========================================================= */
let toastT;
function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 3200);
}
function setStatus(label, orb) {
  const red = cfg.modo === "rojo";
  $("#pill").textContent = (red ? "ALERTA · " : "") + label;
  $("#rcS").textContent = label.toUpperCase();
  Ring.state = orb || "idle";
}
const Ring = {
  N: 60, ticks: [], state: "idle",
  init() {
    const NS = "http://www.w3.org/2000/svg", svg = $("#ring");
    for (let i = 0; i < this.N; i++) { const l = document.createElementNS(NS, "line"); l.dataset.a = String(i / this.N * Math.PI * 2); svg.appendChild(l); this.ticks.push(l); }
    this.draw(0);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { const loop = (ms) => { this.draw(ms / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  },
  draw(t) {
    const red = cfg.modo === "rojo", s = this.state;
    this.ticks.forEach((l, i) => {
      const a = +l.dataset.a; let len;
      if (red) len = 5 + 10 * Math.abs(Math.sin(t * 7 + i * 0.9)) * (i % 2 ? 1 : 0.6);
      else if (s === "think") len = 4 + 10 * Math.max(0, Math.sin(t * 6 - i * 0.45));
      else if (s === "talk") len = 4 + 10 * Math.abs(Math.sin(t * 8 + i * 1.7) * Math.sin(t * 3 + i * 0.5));
      else if (s === "listen") len = 6 + 6 * (0.5 + 0.5 * Math.sin(t * 3)) + 2 * Math.sin(i * 2 + t * 5);
      else len = 3 + 2.5 * (0.5 + 0.5 * Math.sin(t * 1.2 + i * 0.35));
      const sx = Math.sin(a), sy = -Math.cos(a);
      l.setAttribute("x1", (60 + sx * 40).toFixed(1)); l.setAttribute("y1", (60 + sy * 40).toFixed(1));
      l.setAttribute("x2", (60 + sx * (40 + len)).toFixed(1)); l.setAttribute("y2", (60 + sy * (40 + len)).toFixed(1));
    });
  }
};
function readouts() {
  $("#roH").textContent = new Intl.DateTimeFormat("es-PE", { timeZone: "America/Lima", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
  $("#roA").textContent = Timers.list.length; $("#roM").textContent = facts.length;
  $("#roP").textContent = [...PLUG.values()].filter((p) => !p.off).reduce((n, p) => n + p.meta.tools.length, 0) + CORE_TOOLS.length;
}
function renderQuick() {
  const q = $("#quick"); q.textContent = "";
  if (cfg.modo === "rojo") {
    [["POLICÍA", "105"], ["SAMU", "106"], ["BOMBEROS", "116"]].forEach(([n, num]) => { const a = el("a", { href: "tel:" + num }, n); a.append(el("small", {}, num)); q.append(a); });
    q.append(el("button", { type: "button", "data-q": "fin" }, "TERMINAR"));
  } else {
    [["hoy", "HOY"], ["gasto", "GASTO"], ["habitos", "HÁBITOS"], ["manos", "MANOS"], ["memoria", "MEMORIA"]].forEach(([k, n]) => q.append(el("button", { type: "button", "data-q": k }, n)));
  }
}
function applyModo() {
  const red = cfg.modo === "rojo";
  document.documentElement.dataset.modo = cfg.modo;
  $("#modoBtn").textContent = red ? "SALIR" : "ALERTA";
  $("#rcT").textContent = red ? "ALERTA" : "I.V";
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = red ? "#0b0405" : "#04070d";
  renderQuick();
}
function setModo(m) { cfg.modo = m === "rojo" ? "rojo" : "azul"; saveCfg(); applyModo(); setStatus(busy ? "Pensando" : "En línea", Ring.state); }
function entrarAlerta(preguntar) {
  if (cfg.modo === "rojo") return;
  setModo("rojo");
  try { navigator.vibrate && navigator.vibrate([250, 100, 250]); } catch (e) {}
  if (preguntar === false) return;
  const q = "Modo alerta activado. ¿Qué pasó?";
  addMsg("a", q, true); Voice.unlock();
  Voice.speak(q).then(() => { if (cfg.modo === "rojo" && SR && !conv) { conv = true; refreshFree(); listen(); } });
  if (!SR) $("#txt").focus();
}
function salirAlerta(avisar) {
  if (cfg.modo !== "rojo") return;
  setModo("azul"); stopConv(); Voice.stop();
  if (avisar !== false) addMsg("sys", "Alerta terminada. Todo vuelve a la normalidad, " + cfg.nombre + ".", true);
}
function flash() { document.body.classList.add("flash"); setTimeout(() => document.body.classList.remove("flash"), 5000); try { navigator.vibrate && navigator.vibrate([150, 80, 150]); } catch (e) {} }
function refreshFree() { const b = $("#conv"); b.classList.toggle("on", conv); b.setAttribute("aria-pressed", String(conv)); b.textContent = "MANOS LIBRES: " + (conv ? "ACTIVO · di 'apágate' para salir" : "APAGADO"); }
function addMsg(kind, text, persist) {
  const d = document.createElement("div");
  d.className = "msg " + kind; d.textContent = text;
  const box = $("#chat"); box.appendChild(d); box.scrollTop = box.scrollHeight;
  if (persist) { chat.push({ k: kind, t: text, ts: Date.now() }); chat = chat.slice(-80); DB.set("chat", chat); }
  return d;
}
function renderChat() {
  $("#chat").textContent = "";
  chat.forEach((m) => { const d = document.createElement("div"); d.className = "msg " + m.k; d.textContent = m.t; $("#chat").appendChild(d); });
  $("#chat").scrollTop = $("#chat").scrollHeight;
}
function openModal(title, node) {
  $("#mTitle").textContent = title; const b = $("#mBody"); b.textContent = ""; b.appendChild(node); $("#modal").hidden = false;
}
function closeModal() { $("#modal").hidden = true; $("#mBody").textContent = ""; }
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const k in props || {}) { if (k === "class") n.className = props[k]; else if (k.startsWith("data-")) n.setAttribute(k, props[k]); else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]); else n[k] = props[k]; }
  kids.flat().forEach((c) => n.append(c));
  return n;
}

/* =========================================================
   2. Voice: hablar y escuchar
   ========================================================= */
const Voice = {
  voices: [], unlocked: false, speaking: false,
  async load() {
    if (!("speechSynthesis" in window)) return;
    const get = () => (this.voices = speechSynthesis.getVoices());
    if (get().length) return;
    await new Promise((res) => { const t = setTimeout(res, 2000); speechSynthesis.addEventListener("voiceschanged", () => { get(); clearTimeout(t); res(); }, { once: true }); });
  },
  pick() {
    const pref = ["es-PE", "es-MX", "es-US", "es-419", "es-CO", "es-AR", "es-ES"];
    for (const p of pref) { const v = this.voices.find((x) => x.lang.replace("_", "-") === p); if (v) return v; }
    return this.voices.find((x) => /^es/i.test(x.lang)) || null;
  },
  unlock() {
    // Android puede quitar el permiso de audio si la primera voz suena segundos después del toque
    if (this.unlocked || !("speechSynthesis" in window)) return;
    this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  },
  chunks(text) {
    const parts = text.replace(/\s+/g, " ").match(/[^.!?;:\n]+[.!?;:]?/g) || [text];
    const out = []; let cur = "";

const Timers = {
  list: DB.get("timers", []),
  save() { DB.set("timers", this.list); },
  add(ts, text) {
    if (!isFinite(ts) || ts < Date.now() - 1000) throw new Error("la hora ya pasó");
    const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ts, text };
    this.list.push(t); this.save();
    try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
    return t.id;
  },
  cancel(id) { const n = this.list.length; this.list = this.list.filter((t) => t.id !== id); this.save(); return n - this.list.length; },
  fire(t) {
    flash();
    addMsg("sys", "Recordatorio: " + t.text, true); toast("Recordatorio: " + t.text);
    try { if ("Notification" in window && Notification.permission === "granted") new Notification("I.V", { body: t.text }); } catch (e) {}
    Voice.speak("Recordatorio. " + t.text);
  },
  tick() {
    const now = Date.now(); const due = this.list.filter((t) => t.ts <= now);
    if (!due.length) return;
    this.list = this.list.filter((t) => t.ts > now); this.save(); due.forEach((t) => this.fire(t));
  },
  start() { this.tick(); setInterval(() => this.tick(), 5000); }
};

const KNOWN_PERMS = { store: "guardar sus propios datos", voz: "hablar en voz alta", avisos: "programar avisos y recordatorios", internet: "leer datos de internet", celular: "usar funciones del celular (app nativa)", enlaces: "mostrarte botones para abrir WhatsApp, llamadas, mapas o música", firebase: "leer los datos de tu negocio (QR / CIT) en Firebase" };
function workerMain() {

  const api = new Proxy({}, { get: (_, m) => (...args) => new Promise((res, rej) => { const id = ++rid; pending.set(id, { res, rej }); post({ t: "api", rid: id, m: String(m), args }); }) });

    def = d;
    post({ t: "register", meta: { id: d.id, name: d.name, description: d.description, permissions: d.permissions || [],
      tools: (d.tools || []).map((x) => ({ name: x.name, description: x.description, params: x.params || {}, required: x.required || [] })) } });
  } };

    } else if (m.t === "apiResult") {
      const p = pending.get(m.rid); if (p) { pending.delete(m.rid); m.ok ? p.res(m.value) : p.rej(new Error(m.error)); }
    } else if (m.t === "call") {
      try {
        const tool = ((def && def.tools) || []).find((x) => x.name === m.tool);
        if (!tool) throw new Error("la herramienta no existe");
        let v = await tool.run(m.args || {}, api);
        try { v = v === undefined ? null : JSON.parse(JSON.stringify(v)); } catch (e2) { v = String(v); }
        post({ t: "result", cid: m.cid, ok: true, value: v });
      } catch (err) { post({ t: "result", cid: m.cid, ok: false, error: String((err && err.message) || err) }); }
    }

}

  } finally { clearTimeout(t); }
}

function historyContents() {

async function gemini(body) {
  const modelos = [cfg.model].concat(MODELOS_RESPALDO.filter((m) => m !== cfg.model));
  let last = null;
  for (const m of modelos) {
    let r;
    try {
      r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(m) + ":generateContent?key=" + encodeURIComponent(cfg.key),
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch (e) { throw new Error("No pude conectar con Gemini (" + ((e && e.message) || "sin detalle") + "). Prueba AJUSTES > Probar conexión."); }

    const txt = await r.text(); last = { status: r.status, txt };
    if (![404, 429, 503].includes(r.status)) break;
  }
  if (last.status === 400 && /API key/i.test(last.txt)) throw new Error("La clave de Gemini no es válida. Cámbiala en AJUSTES.");
  if (last.status === 403) throw new Error("Gemini rechazó la clave (403). Revisa que esté activa.");
  if (last.status === 429) throw new Error("Se acabó el límite gratis por ahora. Espera un minuto e intenta de nuevo.");

}
async function think(userText, hidden) {
  const contents = historyContents();
  if (hidden) { const last = contents[contents.length - 1]; if (last && last.role === "user") last.parts[0].text += "\n\n" + userText; else contents.push({ role: "user", parts: [{ text: userText }] }); }

    const resp = await gemini({ systemInstruction: { parts: [{ text: systemPrompt() }] }, contents, tools, generationConfig: { temperature: 0.7 } });
    const cand = resp.candidates && resp.candidates[0]; const content = cand && cand.content;
    const parts = (content && content.parts) || [];
    const calls = parts.filter((p) => p.functionCall);
    if (!calls.length) {
      const text = parts.map((p) => p.text || "").join("").trim();
      return text || (cand && cand.finishReason === "SAFETY" ? "No puedo responder eso." : "No obtuve respuesta. Intenta de nuevo.");
    }
    contents.push(content); // se devuelve tal cual (conserva las firmas de pensamiento de Gemini)
    const answers = [];
    for (const p of calls) {
      const { name, args } = p.functionCall;
      addMsg("tool", "▸ " + name);
      let result;
      try { result = CORE_TOOLS.some((t) => t.name === name) ? await runCore(name, args || {}) : await callPluginTool(name, args || {}); }
      catch (e) { result = { error: String(e.message || e) }; }

    }

<script type="text/iv-plugin">
IV.plugin({
  id: "gastos", name: "Gastos e ingresos", description: "Registra gastos e ingresos personales en soles y da resúmenes.", permissions: ["store"],
  tools: [
    { name: "registrar_movimiento", description: "Registra un gasto o un ingreso personal en soles.",
      params: { tipo: { type: "string", description: "gasto o ingreso", enum: ["gasto", "ingreso"] }, monto: { type: "number", description: "Monto en soles" },
                categoria: { type: "string", description: "Categoría corta (comida, transporte, estudio, negocio…)" }, descripcion: { type: "string", description: "Detalle opcional" } },
      required: ["tipo", "monto"],
      run: async (a, api) => {
        const monto = Number(a.monto); if (!(monto > 0)) throw new Error("monto no válido");
        const l = (await api.storeGet("m")) || [];
        const m = { id: Date.now().toString(36), tipo: a.tipo === "ingreso" ? "ingreso" : "gasto", monto, cat: String(a.categoria || "otros").toLowerCase(), desc: String(a.descripcion || ""), ts: Date.now() };
        l.push(m); await api.storeSet("m", l); return { registrado: m.id, tipo: m.tipo, monto: m.monto };
      } },
    { name: "resumen_movimientos", description: "Resume gastos e ingresos de hoy, la semana (7 días) o el mes.",
      params: { periodo: { type: "string", description: "hoy, semana o mes", enum: ["hoy", "semana", "mes"] } }, required: ["periodo"],
      run: async ({ periodo }, api) => {
        const l = (await api.storeGet("m")) || [];
        const ymd = (ts) => new Date(ts).toLocaleDateString("en-CA", { timeZone: "America/Lima" });
        const hoy = ymd(Date.now());
        const ok = (m) => periodo === "hoy" ? ymd(m.ts) === hoy : periodo === "mes" ? ymd(m.ts).slice(0, 7) === hoy.slice(0, 7) : Date.now() - m.ts < 7 * 864e5;
        const sel = l.filter(ok); const tot = { gasto: 0, ingreso: 0 }; const porCat = {};
        sel.forEach((m) => { tot[m.tipo] += m.monto; if (m.tipo === "gasto") porCat[m.cat] = (porCat[m.cat] || 0) + m.monto; });
        return { periodo, gastos: Math.round(tot.gasto * 100) / 100, ingresos: Math.round(tot.ingreso * 100) / 100, balance: Math.round((tot.ingreso - tot.gasto) * 100) / 100, gastos_por_categoria: porCat, movimientos: sel.slice(-10) };
      } },
    { name: "borrar_movimiento", description: "Borra un movimiento por su id.", params: { id: { type: "string", description: "Id" } }, required: ["id"],
      run: async ({ id }, api) => { const l = (await api.storeGet("m")) || []; const m = l.filter((x) => x.id !== id); await api.storeSet("m", m); return { borrados: l.length - m.length }; } }
  ]
});
</script>

<script type="text/iv-plugin">
IV.plugin({
  id: "recordatorios", name: "Recordatorios", description: "Programa avisos para una hora o dentro de unos minutos.", permissions: ["avisos"],
  tools: [
    { name: "crear_recordatorio", description: "Crea un recordatorio. Usa en_minutos (por ejemplo 20) o a_las en formato HH:MM de hora de Perú.",
      params: { texto: { type: "string", description: "Qué recordar" }, en_minutos: { type: "number", description: "Minutos desde ahora" }, a_las: { type: "string", description: "Hora HH:MM (24 h)" } },
      required: ["texto"],
      run: async (a, api) => {
        let ts;
        if (a.en_minutos) ts = Date.now() + Number(a.en_minutos) * 60000;
        else if (a.a_las) {
          const mm = /^(\d{1,2}):(\d{2})$/.exec(String(a.a_las).trim()); if (!mm) throw new Error("hora no válida, usa HH:MM");
          const ymd = new Date().toLocaleDateString("en-CA", { timeZone: "America/Lima" });
          ts = new Date(ymd + "T" + mm[1].padStart(2, "0") + ":" + mm[2] + ":00-05:00").getTime();
          if (ts < Date.now()) ts += 864e5;
        } else throw new Error("falta en_minutos o a_las");
        const id = await api.notifyAt(ts, String(a.texto));
        return { id, suena_a_las: new Intl.DateTimeFormat("es-PE", { timeStyle: "short", dateStyle: "short", timeZone: "America/Lima" }).format(new Date(ts)),
                 aviso: "Solo suena con I.V abierto; con la app nativa sonará siempre." };
      } },
    { name: "listar_recordatorios", description: "Lista los recordatorios pendientes.", run: async (_, api) => api.timersList() },
    { name: "cancelar_recordatorio", description: "Cancela un recordatorio por id.", params: { id: { type: "string", description: "Id" } }, required: ["id"], run: async ({ id }, api) => ({ cancelados: await api.timersCancel(id) }) }
  ]
});
</script>

<script type="text/iv-plugin">
IV.plugin({
  id: "habitos", name: "Hábitos", description: "Marca hábitos del día y calcula rachas.", permissions: ["store"],
  tools: [
    { name: "estado_habitos", description: "Muestra los hábitos de hoy (hechos y pendientes) y la racha de cada uno.",
      run: async (_, api) => {
        const H = await load(api); const hoy = ymd(0);
        return { fecha: hoy, hechos: H.lista.filter((h) => (H.marcas[hoy] || []).includes(h)), pendientes: H.lista.filter((h) => !(H.marcas[hoy] || []).includes(h)),
                 rachas: Object.fromEntries(H.lista.map((h) => [h, racha(H, h)])) };
      } },
    { name: "marcar_habito", description: "Marca (o desmarca) un hábito de hoy. El nombre puede ser parte del texto, por ejemplo 'agua'.",
      params: { habito: { type: "string", description: "Nombre o parte del nombre" }, hecho: { type: "boolean", description: "true para marcar, false para desmarcar" } }, required: ["habito"],
      run: async (a, api) => {
        const H = await load(api); const q = norm(a.habito); const h = H.lista.find((x) => norm(x).includes(q));
        if (!h) throw new Error("no encontré ese hábito: " + a.habito);
        const hoy = ymd(0); const set = new Set(H.marcas[hoy] || []);
        if (a.hecho === false) set.delete(h); else set.add(h);
        H.marcas[hoy] = [...set]; await api.storeSet("h", H); return { habito: h, hecho: set.has(h), racha: racha(H, h) };
      } },
    { name: "agregar_habito", description: "Agrega un hábito nuevo a la lista.", params: { nombre: { type: "string", description: "Nombre del hábito" } }, required: ["nombre"],
      run: async ({ nombre }, api) => { const H = await load(api); if (!H.lista.includes(nombre)) H.lista.push(String(nombre)); await api.storeSet("h", H); return { lista: H.lista }; } }
  ]
});
function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function ymd(offset) { return new Date(Date.now() - offset * 864e5).toLocaleDateString("en-CA", { timeZone: "America/Lima" }); }
async function load(api) {
  const H = await api.storeGet("h");
  return H || { lista: ["Tomar 2L de agua", "Dormir 8h", "Ejercicio 30 min", "Leer 10 páginas", "Nada de redes 1h antes de dormir", "Escribir algo por lo que estoy agradecido"], marcas: {} };
}
function racha(H, h) {
  let n = 0; let d = (H.marcas[ymd(0)] || []).includes(h) ? 0 : 1;
  while ((H.marcas[ymd(d)] || []).includes(h)) { n++; d++; }
  return n;
}
</script>

<script type="text/iv-plugin">

        return { temperatura_c: c.temperature_2m, humedad_pct: c.relative_humidity_2m, viento_kmh: c.wind_speed_10m, cielo };

<script type="text/iv-plugin">
/* Lee los datos reales de QR Créditos y CIT (Firebase). Solo lectura. Los datos de conexión se llenan en AJUSTES. */
const tok = {};
const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
async function entrar(api, neg) {
  const c = ((await api.storeGet("cfg")) || {})[neg];
  if (!c || !c.db || !c.key || !c.email || !c.pass) throw new Error("Falta configurar " + String(neg).toUpperCase() + " en AJUSTES > Conexión con QR / CIT");
  const t = tok[neg];
  if (t && t.exp > Date.now() && t.k === c.key + c.email) return { c, id: t.id };
  const r = await api.http("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(c.key), "POST", { email: c.email, password: c.pass, returnSecureToken: true });
  if (!r || !r.idToken) throw new Error("no pude iniciar sesión en " + neg);
  tok[neg] = { id: r.idToken, exp: Date.now() + 50 * 60 * 1000, k: c.key + c.email };
  return { c, id: r.idToken };
}
const urlDe = (c, id, ruta, extra) => c.db.replace(/\/+$/, "") + "/" + String(ruta || "").replace(/^\/+|\/+$/g, "").replace(/\.json$/, "").split("/").filter(Boolean).map(encodeURIComponent).join("/") + ".json?auth=" + encodeURIComponent(id) + (extra || "");
IV.plugin({
  id: "alfred", name: "Negocio QR / CIT (lectura)", description: "Lee los datos reales de QR Créditos y CIT en Firebase. Solo lectura.", permissions: ["firebase", "store"],
  tools: [
    { name: "negocio_rutas", description: "Muestra qué carpetas hay dentro de la base de datos de QR o CIT (o dentro de una ruta). Úsala primero para saber cómo está organizada.",
      params: { negocio: { type: "string", description: "qr o cit", enum: ["qr", "cit"] }, ruta: { type: "string", description: "Ruta opcional, ej. prestamos" } }, required: ["negocio"],
      run: async ({ negocio, ruta }, api) => { const { c, id } = await entrar(api, negocio); const d = await api.http(urlDe(c, id, ruta, "&shallow=true"), "GET"); return d && typeof d === "object" ? Object.keys(d) : d; } },
    { name: "negocio_leer", description: "Lee datos de QR o CIT. Si 'ruta' es una colección con muchos registros usa 'buscar' (nombre de cliente, asesor, etc.) para traer solo los que coincidan.",
      params: { negocio: { type: "string", description: "qr o cit", enum: ["qr", "cit"] }, ruta: { type: "string", description: "Ruta, ej. prestamos" }, buscar: { type: "string", description: "Texto a buscar dentro de los registros (opcional)" }, max: { type: "number", description: "Máximo de registros (8 por defecto)" } }, required: ["negocio", "ruta"],
      run: async ({ negocio, ruta, buscar, max }, api) => {
        const { c, id } = await entrar(api, negocio); const d = await api.http(urlDe(c, id, ruta), "GET");
        if (!d || typeof d !== "object") return d;
        let ent = Object.entries(d); const total = ent.length;
        if (buscar) { const q = norm(buscar); ent = ent.filter(([k, v]) => norm(k + JSON.stringify(v)).includes(q)); }
        const lim = Math.min(25, Math.max(1, Number(max) || 8)); const out = {};
        ent.slice(0, lim).forEach(([k, v]) => { out[k] = v; });
        return { total_en_ruta: total, coincidencias: ent.length, mostrados: Math.min(lim, ent.length), datos: out };
      } }
  ]
});
</script>
